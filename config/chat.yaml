model: qwen3.8-flash
base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
api_key: "YOUR_DASHSCOPE_API_KEY"
request_timeout_seconds: 30.0
max_tokens: 256
temperature: 0.7
max_history_turns: 4
max_queue_size: 5
system_prompt: >-
  你是机器人语音助手。请使用简洁、自然的中文口语回答，优先控制在适合语音播报的长度。
  不要声称自己已经执行了现实世界中的操作，也不要把对话内容转换为机器人运动控制指令。